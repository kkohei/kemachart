name: Deploy to GitHub Pages

# gh-pages ブランチ方式: ビルドした dist/ を gh-pages ブランチへ公開する。
# (Actions方式のPagesサイト作成はワークフロー権限では不可だったため、この方式を採用)
on:
  push:
    branches: [main, "claude/kema-treatment-logger-cwnsjo"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
